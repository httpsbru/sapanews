<!DOCTYPE html>

<html lang="pt-BR">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Sapacrew | Sapacrew News</title>

        <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Bree+Serif&display=swap"
            rel="stylesheet">

    </head>

    <body>


        <!-- =========================
            HEADER
        ========================== -->

        <header>

            <div class="container">

                <nav>

                    <div class="logo-menu">

                        <h2>
                            Sapacrew <span>NEWS</span>
                        </h2>

                    </div>

                    <button
                        class="menu-mobile"
                        id="menuMobile"
                        type="button"
                    >
                        ☰
                    </button>

                    <ul id="menuLista">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="eventos.html">Eventos</a></li>
                        <li><a href="participantes.html">Integrantes</a></li>
                        <li><a href="regrinhas.html">Regrinhas</a></li>
                        <li><a href="cadastro.html">Entre para o Sapacrew</a></li>
                    </ul>

                </nav>

            </div>

        </header>
        <!-- =========================
            CONTEÚDO
        ========================== -->

        <main class="pagina-noticias">


            <!-- CABEÇALHO DA PÁGINA -->

            <section class="cabecalho-noticias">

                <div class="container">

                    <span class="eyebrow">
                        📰 SAPANEWS
                    </span>

                    <h1>
                        Notícias
                    </h1>

                    <p>
                        Os acontecimentos, fofocas e movimentações
                        que fizeram barulho no SapaCrew.
                    </p>

                </div>

            </section>


            <!-- FILTROS -->

            <section class="filtros-noticias">

                <div class="container">

                    <button class="filtro ativo" data-categoria="todos">
                        Todas
                    </button>

                    <button class="filtro" data-categoria="EXCLUSIVO">
                        🚨 Exclusivo
                    </button>

                    <button class="filtro" data-categoria="ROMANCE">
                        💘 Romance
                    </button>

                    <button class="filtro" data-categoria="TRETA">
                        👀 Treta
                    </button>

                    <button class="filtro" data-categoria="GRUPO">
                        💬 Grupo
                    </button>

                </div>

            </section>


            <!-- NOTÍCIAS -->

            <section class="lista-noticias">

                <div class="container">

                    <div id="noticias-container">

                        <!--
                            As notícias serão inseridas
                            automaticamente pelo JavaScript.
                        -->

                    </div>

                </div>

            </section>


        </main>


        <!-- =========================
            FOOTER
        ========================== -->
